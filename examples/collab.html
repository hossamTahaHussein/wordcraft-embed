<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WordCraft co-editing demo</title>
  <style>
    :root { --line: #d9dce3; --muted: #5d6475; --accent: #2b47b5; color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; grid-template-rows: auto 1fr; font: 14px/1.4 system-ui, sans-serif; color: #1d2230; background: #f6f7f9; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: #fff; }
    header h1 { font-size: 15px; margin: 0; }
    header a { color: var(--accent); }
    #status { margin-left: auto; color: var(--muted); }
    #status.off { color: #a14b00; }
    #status.error { color: #b00020; }
    main { min-height: 0; }
    #editor { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Shared document</h1>
    <span>You are <strong id="me"></strong></span>
    <a id="another" target="_blank" rel="noopener">Open as someone else in a new window</a>
    <span id="status">Connecting…</span>
  </header>
  <main><div id="editor"></div></main>

  <script type="module">
    import { WordCraftEditor } from '/sdk/wordcraft-embed.js';

    const params = new URLSearchParams(location.search);
    const doc = params.get('doc') || 'demo';
    const names = ['Ann', 'Bob', 'Chen', 'Dana', 'Eli', 'Fatma', 'Gus', 'Hiro'];
    const name = params.get('name') || names[Math.floor(Math.random() * names.length)];
    const fileName = `${doc}.docx`;
    document.querySelector('#title').textContent = fileName;
    document.querySelector('#me').textContent = name;
    const other = names.filter((n) => n !== name)[Math.floor(Math.random() * (names.length - 1))];
    document.querySelector('#another').href = `?doc=${encodeURIComponent(doc)}&name=${encodeURIComponent(other)}`;

    const status = document.querySelector('#status');
    let people = 1;
    const show = (text, kind = '') => {
      status.textContent = people > 1 ? `${text} · ${people} people` : text;
      status.className = kind;
    };

    // A document that doesn't exist yet starts blank (before the editor might open it).
    const head = await fetch('/api/files/' + encodeURIComponent(fileName), { method: 'HEAD' });
    if (!head.ok) {
      const blank = await (await fetch('/blank.docx')).blob();
      await fetch('/api/files/' + encodeURIComponent(fileName), { method: 'PUT', body: blank });
    }

    const editor = new WordCraftEditor('#editor', {
      src: '/wordcraft/',
      author: name,
      // Only the first person in the room opens this; everyone else gets the shared copy.
      document: '/api/files/' + encodeURIComponent(fileName),
      documentName: fileName,
      collab: {
        url: `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/relay`,
        // Your backend issues this for the signed-in user; the demo hands one to anyone.
        token: async () => (await (await fetch(`/api/token?doc=${encodeURIComponent(doc)}&name=${encodeURIComponent(name)}`)).json()).token,
      },
      // Autosave (a few seconds after typing stops) and Ctrl+S both land here.
      // The shared document is saved on the server (autosave, Ctrl+S); anything else the editor
      // hands over (File › Export as PDF, Save As another format) is a copy for this person:
      // it downloads, as Download does in Google Docs.
      onSave: async ({ name: file, blob, saveAs }) => {
        // Save As or Export (even as .docx) is this person's copy; Save is the shared document.
        if (saveAs || file !== fileName) {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = file;
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 60_000);
          show(`Downloaded ${file}`);
          return;
        }
        const res = await fetch(`/api/files/${encodeURIComponent(file)}`, { method: 'PUT', body: blob });
        if (!res.ok) throw new Error(`Saving ${file} failed`);
        show(`Saved · ${new Date().toLocaleTimeString()}`);
      },
      onError: (error) => show(error.message, 'error'),
    });
    editor.addEventListener('collab', ({ detail }) => {
      people = detail.connected ? detail.people : 1;
      if (!detail.connected) show(detail.pending ? `Offline — ${detail.pending} edits will sync` : 'Reconnecting…', 'off');
      else show(detail.pending ? 'Saving…' : 'All changes synced');
    });

  </script>
</body>
</html>
