<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WordCraft embed demo</title>
  <style>
    :root { --line: #d9dce3; --muted: #5d6475; --accent: #2b47b5; color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; grid-template: "top top" auto "side main" 1fr / 260px 1fr; font: 14px/1.4 system-ui, sans-serif; color: #1d2230; background: #f6f7f9; }
    header { grid-area: top; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: #fff; }
    header h1 { font-size: 15px; margin: 0; }
    #status { margin-left: auto; color: var(--muted); }
    #status.dirty { color: #a14b00; }
    #status.error { color: #b00020; }
    aside { grid-area: side; border-right: 1px solid var(--line); padding: 12px; overflow: auto; background: #fff; }
    aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
    button, label.button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
    button:hover, label.button:hover { border-color: var(--accent); }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    ul { list-style: none; padding: 0; margin: 0; }
    li button { width: 100%; text-align: left; border: 0; border-radius: 4px; padding: 6px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li button[aria-current="true"] { background: #e8edfb; color: var(--accent); }
    li small { display: block; color: var(--muted); }
    main { grid-area: main; min-height: 0; }
    #editor { width: 100%; height: 100%; }
    @media (max-width: 700px) { body { grid-template: "top" auto "side" auto "main" 1fr / 1fr; } aside { max-height: 30vh; } }
  </style>
</head>
<body>
  <header>
    <h1>My site · Documents</h1>
    <span id="status">Loading editor…</span>
  </header>

  <aside>
    <div class="actions">
      <button id="new" type="button">New document</button>
      <label class="button">Upload… <input id="upload" type="file" accept=".docx,.doc,.odt,.rtf,.md,.html,.txt" hidden></label>
    </div>
    <h2>Saved on the server</h2>
    <ul id="files"><li><small>No documents yet. Press Ctrl+S in the editor to save one.</small></li></ul>
  </aside>

  <main><div id="editor"></div></main>

  <script type="module">
    import { WordCraftEditor } from '/sdk/wordcraft-embed.js';

    const status = document.querySelector('#status');
    const list = document.querySelector('#files');
    let current = null;

    function setStatus(text, kind = '') {
      status.textContent = text;
      status.className = kind;
    }

    const editor = new WordCraftEditor('#editor', {
      src: '/wordcraft/',
      author: 'Demo User',
      onReady: ({ version }) => setStatus(`WordCraft ${version} ready`),
      onDirtyChange: (dirty) => setStatus(dirty ? 'Unsaved changes' : 'All changes saved', dirty ? 'dirty' : ''),
      onError: (error) => setStatus(error.message, 'error'),
      // Ctrl+S, File › Save / Save As and every export land here instead of the Downloads folder.
      onSave: async ({ name, blob, saveAs }) => {
        setStatus(`Saving ${name}…`);
        const response = await fetch(`/api/files/${encodeURIComponent(name)}`, { method: 'PUT', body: blob });
        if (!response.ok) throw new Error(`Saving ${name} failed: ${await response.text()}`);
        if (saveAs || !current) current = name;
        setStatus(`Saved ${name}`);
        refresh();
      },
    });

    async function refresh() {
      const files = await (await fetch('/api/files')).json();
      if (!files.length) return;
      list.replaceChildren(...files.map((file) => {
        const item = document.createElement('li');
        const button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('aria-current', String(file.name === current));
        button.textContent = file.name;
        const meta = document.createElement('small');
        meta.textContent = `${(file.size / 1024).toFixed(1)} KB · ${new Date(file.modified).toLocaleString()}`;
        button.append(meta);
        button.addEventListener('click', () => openFile(file.name, `/api/files/${encodeURIComponent(file.name)}`));
        item.append(button);
        return item;
      }));
    }

    async function openFile(name, source) {
      if (editor.dirty && !confirm('Discard unsaved changes?')) return;
      current = name;
      await editor.open(source, name);
      editor.focus();
      refresh();
    }

    document.querySelector('#upload').addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) openFile(file.name, file);
      event.target.value = '';
    });

    // A new document is a blank .docx under a fresh name; its first Save stores it under that name.
    document.querySelector('#new').addEventListener('click', () => {
      openFile(`Untitled ${new Date().toISOString().slice(0, 10)}.docx`, '/blank.docx');
    });

    refresh();
  </script>
</body>
</html>
